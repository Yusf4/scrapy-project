[project]
name = "scrapy-project"
version = "0.1.0"
description = "Partitioned scraping pipeline for Irish workplace-relations decisions: Scrapy ingestion to MongoDB + MinIO, BeautifulSoup transformation, Dagster orchestration."
requires-python = ">=3.11"
dependencies = [
    "scrapy>=2.13",
    "pymongo>=4.6",
    "boto3>=1.34",
    "beautifulsoup4>=4.12",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.dagster]
module_name = "pipeline.orchestration.definitions"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs the docker-compose services running"]
